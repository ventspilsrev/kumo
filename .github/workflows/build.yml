name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned on purpose: Xcode 16.4 can still target iOS 15.0.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (errors and warnings only)
        run: |
          set -o pipefail
          xcodebuild -project Kumo.xcodeproj -scheme Kumo -configuration Release \
            -sdk iphoneos -derivedDataPath build -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Fake-sign and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Kumo.app
          test -f "$APP/prelude.js"
          ldid -S "$APP/Kumo"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qr Kumo.ipa Payload
          ls -lh Kumo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Kumo-ipa
          path: Kumo.ipa

      - name: Publish release (direct .ipa download for the iPad)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Kumo.ipa \
            --title "Build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" --latest
